<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Mini-Routeur Front</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --surface-hover: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --radius: 12px;
            --transition: all 0.2s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .navbar {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--primary);
        }

        main {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
            flex: 1;
        }

        .page-header {
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Grid des articles */
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.2);
            background-color: var(--surface-hover);
        }

        .card-badge {
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .card-content {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            flex: 1;
        }

        .card-footer {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* Page Détail */
        .detail-view {
            max-width: 700px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .back-btn:hover {
            color: var(--text-main);
            border-color: var(--primary);
        }

        .detail-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 2rem;
        }

        .detail-card h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .detail-card p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        .raw-response {
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.875rem;
            color: #38bdf8;
            overflow-x: auto;
        }

        /* Loading / Error */
        .state-container {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-muted);
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <a href="#/" class="logo">⚡ <span>MonBlog</span></a>
        </div>
    </header>

    <main id="app">
        <!-- Rendu dynamique par le mini-routeur -->
    </main>

    <script>
        /**
         * 🧭 Mini-Routeur Front basé sur les hashs d'URL (#/)
         */
        class MiniRouter {
            constructor(routes, rootElementId = 'app') {
                this.routes = routes;
                this.rootElement = document.getElementById(rootElementId);

                // Écoute des changements de route
                window.addEventListener('hashchange', () => this.handleRoute());
                window.addEventListener('DOMContentLoaded', () => this.handleRoute());
            }

            // Normalisation de l'URL hash
            getHashPath() {
                const hash = window.location.hash.slice(1); // Retire le '#'
                return hash.startsWith('/') ? hash : '/' + hash;
            }

            // Navigation programmatique
            navigate(path) {
                window.location.hash = path;
            }

            // Détection et exécution du contrôleur de vue
            async handleRoute() {
                const currentPath = this.getHashPath();

                for (const route of this.routes) {
                    const match = this.matchRoute(route.path, currentPath);
                    if (match) {
                        this.rootElement.innerHTML = `
                            <div class="state-container">
                                <div class="spinner"></div>
                                <p>Chargement...</p>
                            </div>
                        `;
                        try {
                            const html = await route.handler(match.params);
                            this.rootElement.innerHTML = html;
                        } catch (error) {
                            this.rootElement.innerHTML = `
                                <div class="state-container">
                                    <h2>Erreur</h2>
                                    <p>${error.message || 'Une erreur est survenue.'}</p>
                                    <br>
                                    <a href="#/" class="back-btn">Retour à l'accueil</a>
                                </div>
                            `;
                        }
                        return;
                    }
                }

                // 404 Route non trouvée
                this.rootElement.innerHTML = `
                    <div class="state-container">
                        <h2>404 - Page non trouvée</h2>
                        <p>L'URL demandée n'existe pas.</p>
                        <br>
                        <a href="#/" class="back-btn">Retour à l'accueil</a>
                    </div>
                `;
            }

            // Comparaison de pattern de route avec paramètres dynamiques (:id)
            matchRoute(routePattern, path) {
                const routeSegments = routePattern.split('/').filter(Boolean);
                const pathSegments = path.split('/').filter(Boolean);

                if (routeSegments.length !== pathSegments.length) {
                    return null;
                }

                const params = {};
                for (let i = 0; i < routeSegments.length; i++) {
                    if (routeSegments[i].startsWith(':')) {
                        const paramName = routeSegments[i].slice(1);
                        params[paramName] = decodeURIComponent(pathSegments[i]);
                    } else if (routeSegments[i] !== pathSegments[i]) {
                        return null;
                    }
                }

                return { params };
            }
        }

        /**
         * 📱 Contrôleurs / Vues de l'application
         */

        // 1. Vue Liste des articles (/ et /articles)
        async function renderArticlesList() {
            const response = await fetch('/articles');
            if (!response.ok) throw new Error('Impossible de charger les articles.');
            
            const articles = await response.json();

            return `
                <div class="page-header">
                    <h1 class="page-title">Articles récents</h1>
                    <p class="page-subtitle">Découvrez la liste des articles récupérés depuis l'API Express</p>
                </div>
                <div class="articles-grid">
                    ${articles.map(article => `
                        <a href="#/articles/${article.id}" class="card" id="article-card-${article.id}">
                            <div>
                                <span class="card-badge">Article #${article.id}</span>
                                <h2 class="card-title">${article.title}</h2>
                                <p class="card-content">${article.content || 'Pas de description disponible.'}</p>
                            </div>
                            <div class="card-footer">
                                Voir le détail <span>&rarr;</span>
                            </div>
                        </a>
                    `).join('')}
                </div>
            `;
        }

        // 2. Vue Détail d'un article (/articles/:id)
        async function renderArticleDetail(params) {
            const { id } = params;
            const response = await fetch(`/articles/${id}`);
            if (!response.ok) throw new Error(`Impossible de charger l'article #${id}.`);

            const data = await response.json();

            return `
                <div class="detail-view">
                    <a href="#/" class="back-btn">&larr; Retour aux articles</a>
                    <div class="detail-card">
                        <span class="card-badge">Article #${id}</span>
                        <h1>${data.title || `Article #${id}`}</h1>
                        <p>${data.content || 'Détails de la ressource récupérée depuis /articles/' + id}</p>
                        
                        <div style="margin-top: 2rem;">
                            <h3 style="font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--text-muted);">
                                Réponse brute renvoyée par le serveur (/articles/${id}) :
                            </h3>
                            <pre class="raw-response">${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    </div>
                </div>
            `;
        }

        /**
         * 🚀 Initialisation du Routeur
         */
        const routes = [
            { path: '/', handler: renderArticlesList },
            { path: '/articles', handler: renderArticlesList },
            { path: '/articles/:id', handler: renderArticleDetail }
        ];

        new MiniRouter(routes);
    </script>
</body>
</html>
