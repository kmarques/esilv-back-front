services:
  backend:
    image: node:alpine
    volumes:
      - ./backend:/app
    working_dir: /app
    command: ['npm', 'run', 'dev']
    ports:
      - 3000:3000
    environment:
      JWT_SECRET: cvbhjupiçàu!yèt§r(ertsdxfcvnbjiou)
      DATABASE_URL: postgres://user:password@database/db_name

  frontend:
    image: node:alpine
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: ['npm', 'run', 'dev']
    ports:
      - 5173:5173

  database:
    image: postgres:17-alpine
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: db_name


volumes:
  db-data: {}